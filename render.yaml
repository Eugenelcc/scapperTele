services:
  - type: web
    name: deal-hunter-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false          # set in the Render dashboard (secret)
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: SCAN_INTERVAL_HOURS
        value: "12"          # keep modest to protect free scraping-API credits
      - key: DEFAULT_WATCHES
        value: "iphone 15|900|256;pro , macbook air|1400|m2;m3"
      - key: CAROUSELL_HOST
        value: "www.carousell.sg"
      - key: MAX_RESULTS
        value: "40"
      # Carousell is Cloudflare-protected, so fetches go through a scraping API.
      # Sign up free at scraperapi.com and paste the key in the dashboard.
      - key: SCRAPER_API_KEY
        sync: false          # secret; set in the Render dashboard
      - key: SCRAPER_PROVIDER
        value: "scraperapi"  # or "scrapedo"; "direct" disables the proxy
      - key: SCRAPER_ULTRA_PREMIUM
        value: "true"        # needed to pass Cloudflare (costs more credits)
      # eBay source (free, official, no bot-wall). Create a free app at
      # https://developer.ebay.com and paste the Production keys in the dashboard.
      - key: EBAY_APP_ID
        sync: false
      - key: EBAY_CERT_ID
        sync: false
      - key: EBAY_MARKETPLACE
        value: "EBAY_SG"
      - key: SCAN_TOKEN
        generateValue: true  # random secret for the /scan endpoint
      - key: PYTHON_VERSION
        value: "3.11.9"
    # Optional but recommended: a small persistent disk so the "already seen"
    # history survives redeploys (otherwise you may get one repeat alert after
    # each deploy). Uncomment to enable (not available on the free plan).
    # disk:
    #   name: deal-data
    #   mountPath: /opt/render/project/src/data
    #   sizeGB: 1
